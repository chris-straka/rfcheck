[package]
name = "glbkit-bevy-compat"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Loads GLBs through Bevy's glTF loader headless; nonzero exit if any fails"

[dependencies]
# The games' Bevy, built as they build it (HLH's bevy/Cargo.toml): no default features, the
# same feature list, so a file loads here exactly when it loads in a game. No `jpeg`: a JPEG
# texture (Tripo, UniRig output) fails in the games, and rfcheck raises B_IMAGE_CODEC for it.
bevy = { version = "=0.20.0", default-features = false, features = ["std", "2d", "3d", "ui", "ktx2", "zstd_rust"] }

# Standalone: not part of the rfcheck workspace (Bevy is a heavy build).
[workspace]

[profile.dev.package."*"]
opt-level = 3
