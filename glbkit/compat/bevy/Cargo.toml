[package]
name = "glbkit-bevy-compat"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Loads GLBs through Bevy's glTF loader headless; nonzero exit if any fails"

[dependencies]
# Same Bevy pin as the games (hll-bevy). `jpeg`: AI generators (Tripo, UniRig output) embed JPEG textures.
bevy = { version = "=0.19.1", features = ["jpeg"] }

# Standalone: not part of the rfcheck workspace (Bevy is a heavy build).
[workspace]

[profile.dev.package."*"]
opt-level = 3
